[project]
name = "deriv-signal-bot"
version = "1.0.0"
description = "Triple EMA convergence Telegram signal bot with optional MetaTrader5 execution"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools]
packages = ["config", "src"]
